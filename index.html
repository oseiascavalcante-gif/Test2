<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessibilidade Escolar</title>
    <!-- Ligação com o arquivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="regua" class="regua"></div>

    <header class="toolbar">
        <h1>Portal de Acessibilidade</h1>
        <div class="botoes-ferramentas">
            <button onclick="mudarZoom(-10)">A-</button>
            <button onclick="mudarZoom(10)">A+</button>
            <button onclick="alternarFonte()">Fonte Adaptada</button>
            <button onclick="alternarRegua()">Régua</button>
            <button onclick="alternarTema()">Modo Escuro</button>
        </div>
    </header>

    <main>
        <!-- TELA 1: IDENTIFICAÇÃO -->
        <section id="tela-inicio" class="card">
            <h2>Identificação do Aluno</h2>
            <input type="text" id="nome-aluno" placeholder="Nome do Aluno">
            <input type="text" id="turma-aluno" placeholder="Turma">
            <button class="btn-principal" onclick="iniciar()">Iniciar Triagem</button>

            <div class="historico">
                <h3>Últimas Avaliações:</h3>
                <ul id="lista-historico"></ul>
            </div>
        </section>

        <!-- TELA 2: QUESTIONÁRIO -->
        <section id="tela-pergunta" class="card" style="display: none;">
            <div class="progresso"><div id="barra-progresso"></div></div>
            <h2 id="texto-pergunta">Pergunta...</h2>
            
            <button class="btn-ouvir" onclick="ouvirPergunta()">🔊 Ouvir Pergunta</button>

            <div class="botoes-resposta">
                <button class="btn-nao" onclick="responder('NÃO')">NÃO (N / ←)</button>
                <button class="btn-sim" onclick="responder('SIM')">SIM (S / →)</button>
            </div>
        </section>

        <!-- TELA 3: RELATÓRIO -->
        <section id="tela-resultado" class="card" style="display: none;">
            <div id="conteudo-impressao">
                <h2>Relatório Pedagógico</h2>
                <div id="dados-aluno"></div>
                <hr>
                <h3>Orientações de Acessibilidade:</h3>
                <ul id="lista-recomendacoes"></ul>
            </div>

            <div class="acoes-finais">
                <button class="btn-principal" onclick="imprimirRelatorio()">📄 Imprimir / Salvar PDF</button>
                <button class="btn-secundario" onclick="reiniciar()">🔄 Nova Avaliação</button>
            </div>
        </section>
    </main>

    <!-- Ligação com o arquivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
